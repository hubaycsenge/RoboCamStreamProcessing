# RoboCam server configuration.
#
# Every key here has a default in robocam/config.py; an unknown key is a startup
# error rather than a silent no-op.

server:
  # 0.0.0.0 so a client on the node, or one arriving through the SSH bridge, can
  # reach us. The robot does NOT dial a cluster address: it is behind the lab
  # router's NAT, so it dials out over SSH and meets the server at a rendezvous
  # port on nipg1. See link/README.md; scripts/run_deep3r_bridged.sh is the
  # cluster-side half. Binding 0.0.0.0 rather than 127.0.0.1 is what lets a
  # local benchmark client on the same node connect too.
  bind: "tcp://0.0.0.0:5555"
  io_poll_ms: 20
  # Drop a session that has gone quiet for this long.
  session_timeout_s: 20.0
  max_payload_bytes: 33554432   # 32 MiB
  rcvhwm: 64
  sndhwm: 64

queue:
  # Frames buffered between the socket and the workers. Small on purpose: for a
  # robot, a stale frame is worse than no frame. Raise this only if you start
  # doing batched inference.
  max_depth: 2
  # "oldest" evicts the backlog and keeps latency low. "newest" refuses new
  # arrivals and preserves ordering — use it if a model needs consecutive frames.
  drop_policy: oldest

processor:
  # "stats"  -> report resolution/shape/rate, no models (current default)
  # "noop"   -> reply immediately, measures the transport ceiling
  # "fusion" -> stats plus the LiDAR scan projected into the camera's view
  # "deep3r" -> CUT3R streaming reconstruction: a metric point cloud per frame
  # later: yolo, mast3r, vggt
  #
  # The default stays "stats": it is the measured baseline and needs no model
  # weights, so the transport can always be checked independently of them.
  # Switch with scripts/run_deep3r.sh, which also selects the .venv-cut3r
  # interpreter -- deep3r cannot run in the default venv, whose numpy 2.x
  # conflicts with CUT3R's numpy==1.26.4 pin.
  name: stats
  # deep3r carries a recurrent state that IS the map; a second worker stepping
  # it would interleave frames into one state and corrupt the reconstruction.
  # The processor refuses to run concurrently rather than let that happen.
  workers: 1
  options:
    brightness: true    # mean/std, catches a lens cap or a frozen buffer
    checksum: false     # enable to detect an identical frame being resent
    lidar: true         # include the scan summary when one is attached
    imu: true           # include the inertial summary when one is attached

    # ---- deep3r (used only when processor.name is "deep3r") ----
    # Paths are expanded with ~. "size" must match the checkpoint: 224 for the
    # linear head, 512 for the DPT head. On an RTX 3090 the 512 model runs a
    # frame in ~175 ms; the 224 model is several times faster and is the right
    # choice for a first end-to-end test.
    # weights: ~/CUT3R/checkpoints/cut3r_512_dpt_4_64.pth
    # cut3r_root: ~/CUT3R
    # device: cuda:0
    # size: 512
    # every_n: 1          # run the model on one frame in N; skips still reply
    # min_conf: 2.0       # conf starts at 1.0; 1.5 keeps ~82%, 2.0 keeps ~38%
    # voxel_m: 0.05       # the real control on cloud size
    # max_points: 4000    # backstop cap, lowest confidence dropped first
    # reset_every: 0      # frames between forced state resets; 0 = never
    # reset_on_gap: 0     # seq jump forcing a reset; 0 = 4 * every_n
    # colors: true
    # lidar_check: true   # compare CUT3R's metric scale against the LiDAR

lidar:
  # The robot's LDS-02: 360 points a revolution, ~5 Hz, 0.12-12 m, one
  # horizontal plane. Scans arrive on the same socket as the frames and are
  # answered from the IO thread; the newest one is attached to the next frame
  # for processors to use.
  enabled: true

  # --- the two that describe YOUR robot; check them, do not assume ---
  # Bearing, in the LiDAR's own frame, that the camera looks along. 0 means both
  # point the same way; 180 means the scanner is mounted backwards.
  mount_yaw_deg: 0.0
  # Camera horizontal field of view, used to turn a bearing into an image
  # column. Wrong here means every fused range lands on the wrong object.
  camera_hfov_deg: 70.0

  # --- reporting ---
  sectors: 12         # clearance summary resolution: 12 sectors of 30 degrees
  obstacle_m: 0.5     # a return closer than this ahead raises data.lidar.obstacle
  clear_m: 1.0        # a direction is "free" from this range out
  min_free_deg: 15.0  # narrowest gap reported as a free direction
  front_deg: 60.0     # width of the arc treated as in front
  fov_bins: 32        # horizontal slices of the image that get their own range

  # A scan older than this is not attached to a frame. At 5 Hz a scan is up to
  # 200 ms old before its successor exists, so much below 250 ms means most
  # frames get no ranges at all; much above it and the robot fuses a stale world.
  stale_after_ms: 400.0

imu:
  # The robot's IMU, on the OpenCR board: ~100 Hz of angular rate, specific
  # force, magnetic field and a board-computed orientation quaternion. Samples
  # arrive in bursts on the same socket as the frames, are answered from the IO
  # thread, and the newest burst is attached to the next frame.
  #
  # Axes are the ROS body convention the OpenCR firmware uses: x forward, y
  # left, z up. A level robot at rest reads az = +9.81 and nothing else; if the
  # summary shows a permanent 90 degree tilt, the board is mounted on a
  # different axis and every attitude number is rotated with it.
  enabled: true

  # --- thresholds: when a state becomes true ---
  still_gyro_dps: 2.0       # above this the robot counts as turning
  still_accel_ms2: 0.35     # spread of |accel| above which it counts as shaking
  tilt_warn_deg: 15.0       # tilt beyond which the summary says so
  shock_ms2: 25.0           # peak |accel| treated as an impact (2.5 g)

  # --- health ---
  # How far mean |accel| may sit from 9.81 before a burst is flagged
  # implausible. This is what catches a units mistake or a dead axis, which
  # otherwise produce confident nonsense rather than an obvious error.
  gravity_tolerance_ms2: 2.0

  # A burst older than this is not attached to a frame. Much tighter than the
  # LiDAR's window because the IMU runs 20x faster: inertial data 150 ms old
  # means something is broken, not merely slow.
  stale_after_ms: 150.0

snapshot:
  # Periodically write a decoded frame to disk so you can confirm from your
  # laptop, over the sshfs mount, that real images are arriving.
  enabled: true
  dir: snapshots
  every_n_frames: 150
  latest_only: true
  jpeg_quality: 85
  # Draw the scan on the snapshot: bird's-eye plot plus a depth strip aligned to
  # the image columns. This is how you check mount_yaw_deg without writing code.
  lidar_overlay: true
  # Draw the attitude from the IMU burst: a horizon disc in the opposite corner.
  # A robot on a flat floor must show a level horizon; if it does not, the
  # OpenCR is mounted on a different axis than the config assumes.
  imu_overlay: true

logging:
  level: INFO
  stats_interval_s: 5.0
